<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos México-Puebla</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2e37;
    --text: #e8eaed;
    --muted: #8a8f98;
    --accent: #4f9eff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    padding-bottom: 40px;
  }
  header {
    margin-bottom: 16px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px 0;
  }
  .subtitulo {
    color: var(--muted);
    font-size: 13px;
  }
  .actualizado {
    color: var(--muted);
    font-size: 12px;
    margin-top: 8px;
  }
  .evento {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .evento-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .tipo {
    font-weight: 600;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cuenta {
    font-size: 11px;
    color: var(--muted);
    background: rgba(255,255,255,0.06);
    padding: 2px 8px;
    border-radius: 100px;
  }
  .meta {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .texto {
    font-size: 14px;
    line-height: 1.4;
    margin-bottom: 8px;
  }
  .link {
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
  }
  .vacio {
    color: var(--muted);
    text-align: center;
    padding: 40px 0;
    font-size: 14px;
  }
  .badge-accidente { color: #ff6b6b; }
  .badge-incendio { color: #ff9f43; }
  .badge-robo { color: #feca57; }
  .badge-manifestacion { color: #a29bfe; }
  .badge-cierre_circulacion { color: #ff9f43; }
  .badge-restablecimiento { color: #1dd1a1; }
  .badge-otro { color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>🛣️ Eventos México-Puebla</h1>
  <div class="subtitulo">CAPUFE + Guardia Nacional Carreteras</div>
  <div class="actualizado" id="actualizado"></div>
  <button id="btn-notif" onclick="toggleNotificaciones()" style="margin-top:12px; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600;">🔔 Activar notificaciones</button>
  <div id="sub-container" style="display:none; margin-top:14px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px;">
    <div style="font-size:13px; margin-bottom:8px;">Copia este texto y pégalo donde Claude te indique (solo se hace una vez):</div>
    <textarea id="sub-output" readonly style="width:100%; height:100px; background:#000; color:var(--text); border:1px solid var(--border); border-radius:6px; font-size:11px; padding:8px;"></textarea>
    <button onclick="copiarSuscripcion()" style="margin-top:8px; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:13px;">Copiar</button>
  </div>
</header>

<div id="lista"></div>

<script>
const EMOJIS = {
  accidente: "🚨",
  incendio: "🔥",
  robo: "🚔",
  manifestacion: "✊",
  cierre_circulacion: "🟠",
  restablecimiento: "🟢",
  otro: "ℹ️",
};

function nombreTipo(tipo) {
  return tipo.replaceAll("_", " ").replace(/^\w/, c => c.toUpperCase());
}

async function cargarEventos() {
  const contenedor = document.getElementById("lista");
  try {
    const resp = await fetch("data/eventos.json?_=" + Date.now());
    const eventos = await resp.json();

    document.getElementById("actualizado").textContent =
      "Actualizado: " + new Date().toLocaleString("es-MX");

    if (!eventos.length) {
      contenedor.innerHTML = '<div class="vacio">Sin eventos detectados todavía.</div>';
      return;
    }

    contenedor.innerHTML = eventos.map(ev => `
      <div class="evento">
        <div class="evento-top">
          <div class="tipo badge-${ev.tipo_evento}">
            ${EMOJIS[ev.tipo_evento] || "ℹ️"} ${nombreTipo(ev.tipo_evento)}
          </div>
          <div class="cuenta">@${ev.cuenta}</div>
        </div>
        <div class="meta">
          ${ev.fecha_deteccion}
          ${ev.km ? " · km " + ev.km : ""}
          ${ev.sentido ? " · dirección " + ev.sentido : ""}
        </div>
        ${ev.referencia_cercana ? `<div class="meta">📍 ${ev.referencia_cercana}</div>` : ""}
        <div class="texto">${ev.texto_original}</div>
        <a class="link" href="${ev.url}" target="_blank">Ver publicación original →</a>
        ${ev.lat_aprox ? `<a class="link" style="margin-left:12px" href="https://maps.google.com/?q=${ev.lat_aprox},${ev.lon_aprox}" target="_blank">Ver en mapa →</a>` : ""}
      </div>
    `).join("");
  } catch (e) {
    contenedor.innerHTML = '<div class="vacio">No se pudo cargar la información todavía.</div>';
  }
}

cargarEventos();
setInterval(cargarEventos, 60000); // se actualiza solo cada minuto

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js").catch(() => {});
}

// --- Notificaciones push ---
const VAPID_PUBLIC_KEY = "BGGpoK7q3u0RwYD5U07M9eZyzpuDeOueAeqwHN_crIg1g8Uz1SvdcroocTIckCcHyux1_CQB8OuZi-y_h0gvQdk";

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function toggleNotificaciones() {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
      alert("Este navegador no soporta notificaciones push.");
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      await desactivarNotificaciones();
    } else {
      await activarNotificaciones();
    }
  } catch (e) {
    alert("Error: " + e.message);
  }
}

async function activarNotificaciones() {
  try {
    const permiso = await Notification.requestPermission();
    if (permiso !== "granted") {
      alert("No se otorgó permiso de notificaciones.");
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    document.getElementById("sub-output").value = JSON.stringify(sub);
    document.getElementById("sub-container").style.display = "block";
    await actualizarBotonNotif();
  } catch (e) {
    alert("Error activando notificaciones: " + e.message);
  }
}

async function desactivarNotificaciones() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      await sub.unsubscribe();
    }
    document.getElementById("sub-container").style.display = "none";
    document.getElementById("sub-output").value = "";
    await actualizarBotonNotif();
    alert(
      "Notificaciones desactivadas en este dispositivo.\n\n" +
      "Nota: si ya habías guardado la suscripción como secret en GitHub, " +
      "esa copia sigue ahí. El sistema puede seguir intentando enviarle " +
      "notificaciones (fallará silenciosamente), pero ya no te llegarán " +
      "aquí. Para quitarla por completo del servidor, borra el secret " +
      "PUSH_SUBSCRIPTION en GitHub."
    );
  } catch (e) {
    alert("Error desactivando notificaciones: " + e.message);
  }
}

function copiarSuscripcion() {
  const txt = document.getElementById("sub-output");
  txt.select();
  document.execCommand("copy");
  alert("Copiado. Ahora pégalo donde Claude te indique.");
}

// Al cargar la app, revisa si ya existe una suscripcion activa y ajusta
// el texto del boton (activar/desactivar) en consecuencia
async function actualizarBotonNotif() {
  const btn = document.getElementById("btn-notif");
  if (!btn) return;
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    btn.style.display = "none";
    return;
  }
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    btn.textContent = sub ? "🔕 Desactivar notificaciones" : "🔔 Activar notificaciones";
  } catch (e) {
    // si falla la revisión, se deja el texto por default
  }
}
actualizarBotonNotif();
</script>

</body>
</html>
