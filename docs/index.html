<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C4 Carretero · México-Puebla</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2545">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f3f5;
    --surface: #ffffff;
    --border: #dde1e7;
    --navy: #0b2545;
    --navy-deep: #081b34;
    --gold: #a9812f;
    --gold-soft: #f4ecd8;
    --text: #1c2430;
    --text-muted: #64707d;
    --red: #a83226;
    --red-bg: #f7e6e3;
    --orange: #a15c10;
    --orange-bg: #f6ead9;
    --plum: #7a3352;
    --plum-bg: #f1e2ea;
    --amber: #8a6d1a;
    --amber-bg: #f3ecd6;
    --green: #1f6b3f;
    --green-bg: #e3efe7;
    --slate: #46586e;
    --slate-bg: #e7ebef;
    --font: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
  }
  body { padding-bottom: 40px; }

  /* --- Encabezado institucional --- */
  .header {
    background: var(--navy);
    padding: 20px 18px 18px;
    border-bottom: 3px solid var(--gold);
  }
  .header-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .seal {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: var(--navy-deep);
    flex-shrink: 0;
    overflow: hidden;
  }
  .seal img { width: 100%; height: 100%; object-fit: cover; }
  .header-title {
    color: #ffffff;
    font-size: 19px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .header-subtitle {
    color: #b9c4d4;
    font-size: 12.5px;
    margin-top: 3px;
    line-height: 1.4;
  }
  .status-line {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 14px;
    font-size: 12px;
    color: #a9b6c8;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4caf76;
    flex-shrink: 0;
  }
  .status-line strong { color: #d7f0e0; font-weight: 600; }

  /* --- Boton de notificaciones --- */
  .notif-toggle {
    margin-top: 16px;
    width: 100%;
    background: transparent;
    border: 1.5px solid var(--gold);
    color: var(--gold-soft);
    border-radius: 6px;
    padding: 11px 16px;
    font-family: var(--font);
    font-size: 13.5px;
    font-weight: 600;
  }

  #sub-container {
    display: none;
    margin-top: 12px;
    background: var(--navy-deep);
    border: 1px solid #1c3350;
    border-radius: 6px;
    padding: 12px;
  }
  #sub-container .hint {
    font-size: 12px;
    color: #a9b6c8;
    margin-bottom: 8px;
    line-height: 1.5;
  }
  #sub-output {
    width: 100%;
    height: 80px;
    background: #05101f;
    color: #cfe3d6;
    border: 1px solid #1c3350;
    border-radius: 5px;
    font-family: ui-monospace, monospace;
    font-size: 10px;
    padding: 8px;
    resize: none;
  }
  .copy-btn {
    margin-top: 8px;
    background: var(--gold);
    color: #201607;
    border: none;
    border-radius: 5px;
    padding: 8px 14px;
    font-family: var(--font);
    font-size: 12.5px;
    font-weight: 600;
  }

  /* --- Listado de eventos --- */
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px;
  }
  .evento {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(11,37,69,0.05);
  }
  .evento-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 100px;
  }
  .cuenta {
    font-size: 11.5px;
    color: var(--text-muted);
  }
  .meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 3px;
  }
  .meta.ref { color: var(--navy); font-weight: 500; }
  .texto {
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--text);
    margin: 10px 0 12px;
  }
  .links {
    display: flex;
    gap: 18px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .link {
    font-size: 12.5px;
    color: var(--navy);
    text-decoration: none;
    font-weight: 600;
  }

  .vacio {
    text-align: center;
    padding: 70px 20px;
    color: var(--text-muted);
    font-size: 13.5px;
  }

  .chip-accidente { color: var(--red); background: var(--red-bg); }
  .chip-incendio { color: var(--orange); background: var(--orange-bg); }
  .chip-robo { color: var(--plum); background: var(--plum-bg); }
  .chip-manifestacion { color: var(--amber); background: var(--amber-bg); }
  .chip-cierre_circulacion { color: var(--amber); background: var(--amber-bg); }
  .chip-restablecimiento { color: var(--green); background: var(--green-bg); }
  .chip-otro { color: var(--slate); background: var(--slate-bg); }

  footer {
    max-width: 640px;
    margin: 8px auto 0;
    padding: 0 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 11.5px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div class="seal"><img src="icons/icon-192.png" alt="C4 Carretero"></div>
    <div>
      <p class="header-title">C4 Carretero</p>
      <div class="header-subtitle">CAPUFE y Guardia Nacional · Tramo México-Puebla</div>
    </div>
  </div>
  <div class="status-line">
    <span class="status-dot"></span>
    <strong>Monitoreo activo</strong>
    <span id="actualizado"></span>
  </div>
  <button id="btn-notif" class="notif-toggle" onclick="toggleNotificaciones()">Activar notificaciones</button>
  <div id="sub-container">
    <div class="hint">Copia este código y pégalo donde Claude te indique (solo se hace una vez):</div>
    <textarea id="sub-output" readonly></textarea>
    <button class="copy-btn" onclick="copiarSuscripcion()">Copiar</button>
  </div>
</div>

<main>
  <div id="lista"></div>
</main>

<footer>Sistema de monitoreo carretero · Datos públicos de CAPUFE y Guardia Nacional</footer>

<script>
const EMOJIS = {
  accidente: "🚨",
  incendio: "🔥",
  robo: "🚔",
  manifestacion: "✊",
  cierre_circulacion: "🟠",
  restablecimiento: "🟢",
  otro: "ℹ️",
};

function nombreTipo(tipo) {
  return tipo.replaceAll("_", " ").replace(/^\w/, c => c.toUpperCase());
}

async function cargarEventos() {
  const contenedor = document.getElementById("lista");
  try {
    const resp = await fetch("data/eventos.json?_=" + Date.now());
    const eventos = await resp.json();

    document.getElementById("actualizado").textContent =
      "· Actualizado " + new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });

    if (!eventos.length) {
      contenedor.innerHTML = '<div class="vacio">Sin eventos detectados en el tramo por ahora.</div>';
      return;
    }

    contenedor.innerHTML = eventos.map(ev => `
      <div class="evento">
        <div class="evento-top">
          <span class="chip chip-${ev.tipo_evento}">${EMOJIS[ev.tipo_evento] || "ℹ️"} ${nombreTipo(ev.tipo_evento)}</span>
          <span class="cuenta">@${ev.cuenta}</span>
        </div>
        <div class="meta">
          ${ev.fecha_deteccion}
          ${ev.km ? " · km " + ev.km : ""}
          ${ev.sentido ? " · dirección " + ev.sentido : ""}
        </div>
        ${ev.referencia_cercana ? `<div class="meta ref">📍 ${ev.referencia_cercana}</div>` : ""}
        <div class="texto">${ev.texto_original}</div>
        <div class="links">
          <a class="link" href="${ev.url}" target="_blank">Ver publicación →</a>
          ${ev.lat_aprox ? `<a class="link" href="https://maps.google.com/?q=${ev.lat_aprox},${ev.lon_aprox}" target="_blank">Ver en mapa →</a>` : ""}
        </div>
      </div>
    `).join("");
  } catch (e) {
    contenedor.innerHTML = '<div class="vacio">No se pudo sincronizar con el servidor.</div>';
  }
}

cargarEventos();
setInterval(cargarEventos, 60000); // se actualiza solo cada minuto

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js").catch(() => {});
}

// --- Notificaciones push ---
const VAPID_PUBLIC_KEY = "BGGpoK7q3u0RwYD5U07M9eZyzpuDeOueAeqwHN_crIg1g8Uz1SvdcroocTIckCcHyux1_CQB8OuZi-y_h0gvQdk";

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

// --- Almacenamiento local de la bandera activo/inactivo (IndexedDB) ---
const DB_NOMBRE = "notif-store";
const DB_TIENDA = "flags";

function abrirDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NOMBRE, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(DB_TIENDA);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function setNotificacionesActivas(valor) {
  const db = await abrirDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_TIENDA, "readwrite");
    tx.objectStore(DB_TIENDA).put(valor, "activo");
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getNotificacionesActivas() {
  try {
    const db = await abrirDB();
    return new Promise((resolve) => {
      const tx = db.transaction(DB_TIENDA, "readonly");
      const req = tx.objectStore(DB_TIENDA).get("activo");
      req.onsuccess = () => resolve(req.result !== false);
      req.onerror = () => resolve(true);
    });
  } catch (e) {
    return true;
  }
}

async function toggleNotificaciones() {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
      alert("Este navegador no soporta notificaciones push.");
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();

    if (!sub) {
      await activarPorPrimeraVez();
      return;
    }

    const estaActivo = await getNotificacionesActivas();
    await setNotificacionesActivas(!estaActivo);
    actualizarBotonNotif();
  } catch (e) {
    alert("Error: " + e.message);
  }
}

async function activarPorPrimeraVez() {
  try {
    const permiso = await Notification.requestPermission();
    if (permiso !== "granted") {
      alert("No se otorgó permiso de notificaciones.");
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    await setNotificacionesActivas(true);
    document.getElementById("sub-output").value = JSON.stringify(sub);
    document.getElementById("sub-container").style.display = "block";
    actualizarBotonNotif();
  } catch (e) {
    alert("Error activando notificaciones: " + e.message);
  }
}

function copiarSuscripcion() {
  const txt = document.getElementById("sub-output");
  txt.select();
  document.execCommand("copy");
  alert("Copiado. Ahora pégalo donde Claude te indique.");
}

async function actualizarBotonNotif() {
  const btn = document.getElementById("btn-notif");
  if (!btn) return;
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    btn.style.display = "none";
    return;
  }
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (!sub) {
      btn.textContent = "Activar notificaciones";
      return;
    }
    const activas = await getNotificacionesActivas();
    btn.textContent = activas ? "Desactivar notificaciones" : "Activar notificaciones";
  } catch (e) {
    // si falla la revisión, se deja el texto por default
  }
}
actualizarBotonNotif();
</script>

</body>
</html>
