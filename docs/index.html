<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C4 Carretero · México-Puebla</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050c16">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050c16;
    --panel: #0d1c2e;
    --panel-border: #1c3350;
    --gold: #c9a227;
    --gold-bright: #e8c458;
    --cyan: #35c5f0;
    --text: #e9eef4;
    --text-dim: #7d92a8;
    --red: #ff4d4f;
    --orange: #ff9f43;
    --magenta: #ff5c8a;
    --amber: #f0b90b;
    --green: #2ecc71;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
  }
  body {
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(53,197,240,0.10), transparent 60%),
      repeating-linear-gradient(0deg, rgba(201,162,39,0.05) 0px, rgba(201,162,39,0.05) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, rgba(201,162,39,0.05) 0px, rgba(201,162,39,0.05) 1px, transparent 1px, transparent 40px);
    padding-bottom: 48px;
  }

  /* --- Barra de mando --- */
  .cmd-bar {
    border-bottom: 1px solid var(--panel-border);
    background: linear-gradient(180deg, rgba(13,28,46,0.9), rgba(13,28,46,0.55));
    padding: 18px 18px 16px;
  }
  .cmd-top {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .cmd-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .cmd-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--gold-bright);
    margin: 0;
  }
  .cmd-subtitle {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    margin-top: 2px;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 0 rgba(46,204,113,0.6);
    animation: pulse 2.2s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(46,204,113,0.55); }
    70%  { box-shadow: 0 0 0 7px rgba(46,204,113,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pulse-dot { animation: none; }
  }
  .status-label { color: var(--green); font-weight: 500; }

  /* --- Boton de notificaciones (estilo interruptor de panel) --- */
  .notif-toggle {
    margin-top: 14px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--gold-bright);
    border-radius: 8px;
    padding: 12px 16px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    letter-spacing: 0.04em;
    font-weight: 500;
    text-transform: uppercase;
  }
  .notif-toggle:active { background: #12253a; }

  #sub-container {
    display: none;
    margin-top: 12px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px;
  }
  #sub-container .hint {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-dim);
    margin-bottom: 8px;
    line-height: 1.5;
  }
  #sub-output {
    width: 100%;
    height: 90px;
    background: #020509;
    color: var(--cyan);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    padding: 8px;
    resize: none;
  }
  .copy-btn {
    margin-top: 8px;
    background: var(--gold);
    color: #05101d;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* --- Feed de eventos --- */
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px;
  }
  .evento {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--sev-color, var(--cyan));
    border-radius: 6px;
    padding: 14px 14px 14px 16px;
    margin-bottom: 12px;
  }
  .evento-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
  }
  .tipo {
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  .cuenta {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-dim);
    background: #06111c;
    border: 1px solid var(--panel-border);
    padding: 3px 8px;
    border-radius: 100px;
    white-space: nowrap;
  }
  .meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 6px;
    letter-spacing: 0.01em;
  }
  .meta.ref { color: var(--cyan); }
  .texto {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 10px;
  }
  .links {
    display: flex;
    gap: 16px;
    border-top: 1px solid var(--panel-border);
    padding-top: 10px;
  }
  .link {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--gold-bright);
    text-decoration: none;
    letter-spacing: 0.02em;
  }

  .vacio {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 12.5px;
    letter-spacing: 0.02em;
  }

  .badge-accidente { --sev-color: var(--red); }
  .badge-incendio { --sev-color: var(--orange); }
  .badge-robo { --sev-color: var(--magenta); }
  .badge-manifestacion { --sev-color: var(--amber); }
  .badge-cierre_circulacion { --sev-color: var(--amber); }
  .badge-restablecimiento { --sev-color: var(--green); }
  .badge-otro { --sev-color: var(--cyan); }
</style>
</head>
<body>

<div class="cmd-bar">
  <div class="cmd-top">
    <img class="cmd-icon" src="icons/icon-192.png" alt="C4 Carretero">
    <div>
      <p class="cmd-title">C4 CARRETERO</p>
      <div class="cmd-subtitle">CAPUFE · GUARDIA NACIONAL · TRAMO MÉXICO–PUEBLA</div>
    </div>
  </div>
  <div class="status-row">
    <span class="pulse-dot"></span>
    <span class="status-label">MONITOREO ACTIVO</span>
    <span id="actualizado"></span>
  </div>
  <button id="btn-notif" class="notif-toggle" onclick="toggleNotificaciones()">🔔 Activar notificaciones</button>
  <div id="sub-container">
    <div class="hint">Copia este código y pégalo donde Claude te indique (solo se hace una vez):</div>
    <textarea id="sub-output" readonly></textarea>
    <button class="copy-btn" onclick="copiarSuscripcion()">Copiar</button>
  </div>
</div>

<main>
  <div id="lista"></div>
</main>

<script>
const EMOJIS = {
  accidente: "🚨",
  incendio: "🔥",
  robo: "🚔",
  manifestacion: "✊",
  cierre_circulacion: "🟠",
  restablecimiento: "🟢",
  otro: "ℹ️",
};

function nombreTipo(tipo) {
  return tipo.replaceAll("_", " ").replace(/^\w/, c => c.toUpperCase());
}

async function cargarEventos() {
  const contenedor = document.getElementById("lista");
  try {
    const resp = await fetch("data/eventos.json?_=" + Date.now());
    const eventos = await resp.json();

    document.getElementById("actualizado").textContent =
      "· SYNC " + new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });

    if (!eventos.length) {
      contenedor.innerHTML = '<div class="vacio">SIN EVENTOS DETECTADOS EN EL TRAMO</div>';
      return;
    }

    contenedor.innerHTML = eventos.map(ev => `
      <div class="evento badge-${ev.tipo_evento}">
        <div class="evento-top">
          <div class="tipo">${EMOJIS[ev.tipo_evento] || "ℹ️"} ${nombreTipo(ev.tipo_evento)}</div>
          <div class="cuenta">@${ev.cuenta}</div>
        </div>
        <div class="meta">
          ${ev.fecha_deteccion}
          ${ev.km ? " · KM " + ev.km : ""}
          ${ev.sentido ? " · DIR " + ev.sentido.toUpperCase() : ""}
        </div>
        ${ev.referencia_cercana ? `<div class="meta ref">📍 ${ev.referencia_cercana}</div>` : ""}
        <div class="texto">${ev.texto_original}</div>
        <div class="links">
          <a class="link" href="${ev.url}" target="_blank">VER PUBLICACIÓN →</a>
          ${ev.lat_aprox ? `<a class="link" href="https://maps.google.com/?q=${ev.lat_aprox},${ev.lon_aprox}" target="_blank">VER EN MAPA →</a>` : ""}
        </div>
      </div>
    `).join("");
  } catch (e) {
    contenedor.innerHTML = '<div class="vacio">NO SE PUDO SINCRONIZAR CON EL SERVIDOR</div>';
  }
}

cargarEventos();
setInterval(cargarEventos, 60000); // se actualiza solo cada minuto

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js").catch(() => {});
}

// --- Notificaciones push ---
const VAPID_PUBLIC_KEY = "BGGpoK7q3u0RwYD5U07M9eZyzpuDeOueAeqwHN_crIg1g8Uz1SvdcroocTIckCcHyux1_CQB8OuZi-y_h0gvQdk";

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

// --- Almacenamiento local de la bandera activo/inactivo (IndexedDB) ---
const DB_NOMBRE = "notif-store";
const DB_TIENDA = "flags";

function abrirDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NOMBRE, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(DB_TIENDA);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function setNotificacionesActivas(valor) {
  const db = await abrirDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_TIENDA, "readwrite");
    tx.objectStore(DB_TIENDA).put(valor, "activo");
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getNotificacionesActivas() {
  try {
    const db = await abrirDB();
    return new Promise((resolve) => {
      const tx = db.transaction(DB_TIENDA, "readonly");
      const req = tx.objectStore(DB_TIENDA).get("activo");
      req.onsuccess = () => resolve(req.result !== false);
      req.onerror = () => resolve(true);
    });
  } catch (e) {
    return true;
  }
}

async function toggleNotificaciones() {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
      alert("Este navegador no soporta notificaciones push.");
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();

    if (!sub) {
      await activarPorPrimeraVez();
      return;
    }

    const estaActivo = await getNotificacionesActivas();
    await setNotificacionesActivas(!estaActivo);
    actualizarBotonNotif();
  } catch (e) {
    alert("Error: " + e.message);
  }
}

async function activarPorPrimeraVez() {
  try {
    const permiso = await Notification.requestPermission();
    if (permiso !== "granted") {
      alert("No se otorgó permiso de notificaciones.");
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    await setNotificacionesActivas(true);
    document.getElementById("sub-output").value = JSON.stringify(sub);
    document.getElementById("sub-container").style.display = "block";
    actualizarBotonNotif();
  } catch (e) {
    alert("Error activando notificaciones: " + e.message);
  }
}

function copiarSuscripcion() {
  const txt = document.getElementById("sub-output");
  txt.select();
  document.execCommand("copy");
  alert("Copiado. Ahora pégalo donde Claude te indique.");
}

async function actualizarBotonNotif() {
  const btn = document.getElementById("btn-notif");
  if (!btn) return;
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    btn.style.display = "none";
    return;
  }
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (!sub) {
      btn.textContent = "🔔 Activar notificaciones";
      return;
    }
    const activas = await getNotificacionesActivas();
    btn.textContent = activas ? "🔕 Desactivar notificaciones" : "🔔 Activar notificaciones";
  } catch (e) {
    // si falla la revisión, se deja el texto por default
  }
}
actualizarBotonNotif();
</script>

</body>
</html>
